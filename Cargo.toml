[package]
name = "penplot-gcoder"
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
description = "Offline pen plotter workstation and G-code compiler"
publish = false
default-run = "penplot-studio"

[lib]
name = "penplot"
path = "src-rs/lib.rs"

[[bin]]
name = "penplot"
path = "src-rs/cli.rs"

[[bin]]
name = "penplot-studio"
path = "src-rs/desktop.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
usvg = { version = "=0.45.1", default-features = false }
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"
sha2 = "=0.10.9"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "=0.32.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "=0.15.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
