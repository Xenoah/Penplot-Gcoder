name: Rust workstation
on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --release --bins
      - name: Inspect sample without a machine
        if: runner.os == 'Windows'
        run: ./target/release/penplot.exe check --fit 5 examples/alignment-card.svg
      - name: Package Windows binaries, examples and attributions
        if: runner.os == 'Windows'
        run: python scripts/package-windows.py x86_64-pc-windows-msvc target/release Penplot-Studio-Windows-x64.zip
      - name: Archive portable Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Penplot-Studio-Windows-x64
          path: Penplot-Studio-Windows-x64.zip
          if-no-files-found: error
