name: Publish Penplot-Gcoder v0.1.0
on:
  push:
    branches: ['release/penplot-v0.1.0']
    paths: ['.github/workflows/publish-penplot-v0.1.0.yml']

permissions: {}
concurrency:
  group: publish-penplot-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xenoah/Penplot-Gcoder' && github.ref == 'refs/heads/release/penplot-v0.1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: 'Xenoah/Penplot-Gcoder'
      TAG: v0.1.0
      TARGET: 'ef75b1bcd60fb65350506d31385bdb8d2dcadf5b'
      BUILD: 'c44cbb373ae9fb129c05ffd52e6bb070268c7e16'
      TESTED_TREE: '5cba64141f06ef9db9f008ae13e8935a1677b845'
      RUN_ID: '44965188864'
      ASSET: Penplot-Studio-Windows-x64.zip
    steps:
      - name: Verify CI, publish Windows ZIP and read back the release
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cd "$work"
          test "$(gh api "repos/$GH_REPO/commits/$TARGET" --jq .commit.tree.sha)" = "$TESTED_TREE"
          test "$(gh api "repos/$GH_REPO/commits/$BUILD" --jq .commit.tree.sha)" = "$TESTED_TREE"
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$BUILD"
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; no overwrite attempted."
            exit 1
          fi
          existing_tag="$(gh api --method GET "repos/$GH_REPO/git/matching-refs/tags/$TAG" --jq '.[] | select(.ref == "refs/tags/v0.1.0") | .object.sha')"
          if [ -n "$existing_tag" ]; then
            test "$existing_tag" = "$TARGET"
          fi
          gh run download "$RUN_ID" --name Penplot-Studio-Windows-x64 --dir "$work"
          test -s "$ASSET"
          unzip -tq "$ASSET"
          sha="$(sha256sum "$ASSET" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$sha" "$ASSET" > "$ASSET.sha256"
          cat > notes.md <<'NOTES'
          Penplot-Gcoder の初の Rust 版です。Windows x64 では ZIP を展開して `penplot-studio.exe` を起動してください。Python は不要です。
          
          - SVG・DXF・PNG・JPEG 入力、編集、2D／等角 3D プレビュー、プロジェクト保存、G-code 出力。
          - EasyThreed K9 向けに手動 HOME 前提の Z リフト、ペンを下ろさない空運転、座標チェックを追加。加熱、押出、自動 HOME の命令は出しません。
          - GitHub Actions の Windows／Linux テストとビルドが成功。Windows GUI の実機起動と K9 本体の動作は未確認です。USB 直接送信、サーボ／FAN／GPIO 制御は未対応です。
          - 従来の Python 版と β0.1 リリースは残しています。
          NOTES
          printf '\nWindows ZIP SHA-256: `%s`\n\nCI: https://github.com/Xenoah/Penplot-Gcoder/actions/runs/44965188864\n' "$sha" >> notes.md
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" --target "$TARGET" --title "Penplot-Gcoder Studio v0.1.0" --notes-file notes.md --latest
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$TARGET"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          mkdir verified
          gh release download "$TAG" --pattern "$ASSET" --pattern "$ASSET.sha256" --dir verified
          (cd verified && sha256sum -c "$ASSET.sha256")
          gh release view "$TAG" --json url,tagName,isDraft,assets
